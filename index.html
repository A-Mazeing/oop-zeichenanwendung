<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOP Zeichenanwendung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        panel: '#f8fafc',
                        panelBorder: '#e2e8f0',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-100 h-screen flex flex-col overflow-hidden text-sm text-slate-700">

    <!-- Obere Leiste -->
    <header class="bg-white border-b border-panelBorder px-4 py-2 flex items-center gap-4 shrink-0">
        <h1 class="text-base font-bold text-slate-800 tracking-tight">OOP Zeichenanwendung</h1>
        <span class="text-xs text-slate-400">Model-View-Controller</span>
        <div class="ml-auto flex items-center gap-2">
            <button id="projekt-speichern-btn"
                class="projekt-btn flex items-center gap-1.5 text-xs font-medium text-slate-600 hover:text-slate-800 px-2.5 py-1.5 rounded border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition"
                title="Projekt als Datei speichern">
                <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                Speichern
            </button>
            <button id="projekt-laden-btn"
                class="projekt-btn flex items-center gap-1.5 text-xs font-medium text-slate-600 hover:text-slate-800 px-2.5 py-1.5 rounded border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition"
                title="Projekt aus Datei laden">
                <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Laden
            </button>
            <input type="file" id="projekt-datei-input" accept=".json,.oop" class="hidden">
        </div>
    </header>

    <!-- Hauptbereich: Toolbar | Canvas | Inspektor -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Toolbar (links) -->
        <aside id="toolbar" class="w-14 bg-white border-r border-panelBorder flex flex-col items-center py-3 gap-1 shrink-0">
            <button data-werkzeug="auswahl" class="werkzeug-btn aktiv" title="Auswahl (V)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                </svg>
            </button>
            <button data-werkzeug="rechteck" class="werkzeug-btn" title="Rechteck (R)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="1"/>
                </svg>
            </button>
            <button data-werkzeug="ellipse" class="werkzeug-btn" title="Ellipse (E)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="12" rx="10" ry="7"/>
                </svg>
            </button>
            <button data-werkzeug="linie" class="werkzeug-btn" title="Linie (L)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="20" x2="20" y2="4"/>
                </svg>
            </button>
            <button data-werkzeug="dreieck" class="werkzeug-btn" title="Dreieck (D)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12,3 22,21 2,21"/>
                </svg>
            </button>
            <button data-werkzeug="text" class="werkzeug-btn" title="Text (T)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <text x="6" y="18" font-size="16" fill="currentColor" stroke="none" font-family="serif" font-weight="bold">T</text>
                </svg>
            </button>
            <button data-werkzeug="bild" class="werkzeug-btn" title="Bild (B)">
                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
            </button>

            <div class="border-t border-panelBorder w-8 my-2"></div>

            <!-- Farbwahl -->
            <label class="werkzeug-farbe" title="Fuellfarbe">
                <input type="color" id="fuellfarbe" value="#3b82f6" class="sr-only">
                <span id="fuellfarbe-vorschau" class="w-6 h-6 rounded border border-slate-300 block cursor-pointer" style="background:#3b82f6"></span>
            </label>
            <span class="text-[10px] text-slate-400 select-none">Fuell</span>

            <label class="werkzeug-farbe mt-1" title="Linienfarbe">
                <input type="color" id="linienfarbe" value="#1e293b" class="sr-only">
                <span id="linienfarbe-vorschau" class="w-6 h-6 rounded border border-slate-300 block cursor-pointer" style="background:#1e293b"></span>
            </label>
            <span class="text-[10px] text-slate-400 select-none">Linie</span>
        </aside>

        <!-- Linkes Panel: Hierarchie / Dateien (Tabs) -->
        <aside id="linkes-panel" class="linkes-panel bg-white border-r border-panelBorder flex flex-col overflow-hidden shrink-0">
            <!-- Tab-Leiste -->
            <div class="linkes-panel-tabs flex border-b border-panelBorder bg-slate-50 shrink-0">
                <button class="linkes-panel-tab aktiv" data-lp-tab="hierarchie">Hierarchie</button>
                <button class="linkes-panel-tab" data-lp-tab="dateien">Dateien</button>
            </div>

            <!-- Tab: Hierarchie -->
            <div id="lp-tab-hierarchie" class="lp-tab-inhalt flex-1 overflow-y-auto">
                <div id="hierarchie-liste" class="p-1"></div>
            </div>

            <!-- Tab: Dateien -->
            <div id="lp-tab-dateien" class="lp-tab-inhalt flex-1 overflow-hidden flex flex-col" style="display:none;">
                <div id="dateien-liste" class="flex-1 overflow-y-auto p-1"></div>
                <div class="shrink-0 p-2 border-t border-panelBorder">
                    <label id="dateien-upload-btn" class="dateien-upload-label flex items-center justify-center gap-1.5 text-xs font-medium text-slate-600 hover:text-slate-800 px-2.5 py-1.5 rounded border border-dashed border-slate-300 hover:border-slate-400 hover:bg-slate-50 cursor-pointer transition">
                        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Bild hochladen
                        <input type="file" id="dateien-upload-input" accept="image/*" multiple class="hidden">
                    </label>
                </div>
                <!-- Drop-Zone Overlay (wird bei Drag sichtbar) -->
                <div id="dateien-dropzone" class="dateien-dropzone">
                    <div class="dateien-dropzone-inhalt">
                        <svg viewBox="0 0 24 24" class="w-8 h-8 text-sky-500" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <span class="text-xs text-slate-500 mt-1">Bilder hier ablegen</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Canvas (Mitte) -->
        <main class="flex-1 relative bg-white overflow-hidden canvas-bereich">
            <canvas id="zeichenflaeche"></canvas>
        </main>

        <!-- Inspektor (rechts) -->
        <aside id="inspektor" class="w-72 bg-white border-l border-panelBorder flex flex-col overflow-hidden shrink-0">

            <!-- Klassenansicht -->
            <div id="klassenansicht-bereich" class="border-b border-panelBorder flex flex-col overflow-hidden" style="max-height:50%">
                <h3 class="inspektor-section-header px-3 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 border-b border-panelBorder shrink-0 cursor-pointer select-none flex items-center justify-between" data-section="klassen">
                    <span>Klassenansicht</span>
                    <svg class="inspektor-section-pfeil w-3 h-3 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </h3>
                <div id="klassenansicht" class="p-2 overflow-y-auto"></div>
            </div>

            <!-- Objektansicht -->
            <div id="objektansicht-bereich" class="flex-1 flex flex-col overflow-hidden">
                <h3 class="inspektor-section-header px-3 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 border-b border-panelBorder shrink-0 cursor-pointer select-none flex items-center justify-between" data-section="objekte">
                    <span>Objektansicht</span>
                    <svg class="inspektor-section-pfeil w-3 h-3 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </h3>
                <div id="objektansicht" class="p-2 flex-1 overflow-y-auto"></div>
            </div>
        </aside>
    </div>

    <!-- Code-Editor (unten) -->
    <div id="editor-bereich" class="bg-white border-t border-panelBorder flex flex-col shrink-0" style="height: 240px;">
        <!-- Resize-Handle zum Ziehen -->
        <div id="editor-resize-handle"></div>

        <div class="flex items-center justify-between px-3 py-1.5 bg-slate-50 border-b border-panelBorder">
            <div class="flex items-center gap-0">
                <button class="editor-tab aktiv" data-tab="code">Code-Editor</button>
                <button class="editor-tab" data-tab="klassen">Klassen-Editor</button>
            </div>
            <div class="flex items-center gap-2">
                <span id="editor-status" class="text-xs text-slate-400"></span>
                <button id="ausfuehren-btn"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1 rounded transition">
                    Ausfuehren
                </button>
                <button id="editor-einklappen-btn"
                    class="editor-einklappen-btn text-slate-400 hover:text-slate-600 transition"
                    title="Editor ein-/ausklappen">
                    <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Tab: Code-Editor -->
        <div id="tab-code" class="tab-inhalt flex flex-1 overflow-hidden">
            <textarea id="code-editor"
                class="flex-1 p-3 font-mono text-xs resize-none outline-none bg-slate-900 text-slate-100 leading-relaxed"
                spellcheck="false"
                placeholder="// Beispiel:&#10;Rechteck r1 = neu Rechteck(50, 50, 150, 100)&#10;r1.setzeFarbe(&quot;gelb&quot;)&#10;r1.verschieben(20, 0)"></textarea>
            <div id="konsole"
                class="w-72 bg-slate-950 text-slate-300 p-3 font-mono text-xs overflow-y-auto border-l border-slate-700">
                <span class="text-slate-500">// Ausgabe erscheint hier</span>
            </div>
        </div>

        <!-- Tab: Klassen-Editor -->
        <div id="tab-klassen" class="tab-inhalt flex flex-1 overflow-hidden" style="display:none;">
            <div class="flex flex-col flex-1 overflow-hidden">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 border-b border-slate-700">
                    <label class="text-xs text-slate-400">Klasse:</label>
                    <select id="klassen-auswahl"
                        class="bg-slate-700 text-slate-200 text-xs px-2 py-1 rounded border border-slate-600 outline-none">
                        <option value="Rechteck">Rechteck</option>
                        <option value="Ellipse">Ellipse</option>
                        <option value="Linie">Linie</option>
                        <option value="Dreieck">Dreieck</option>
                        <option value="TextObjekt">TextObjekt</option>
                        <option value="BildObjekt">BildObjekt</option>
                    </select>
                    <button id="methoden-uebernehmen-btn"
                        class="ml-auto bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-3 py-1 rounded transition">
                        Uebernehmen
                    </button>
                </div>
                <textarea id="klassen-editor"
                    class="flex-1 p-3 font-mono text-xs resize-none outline-none bg-slate-900 text-slate-100 leading-relaxed"
                    spellcheck="false"></textarea>
            </div>
            <div id="klassen-konsole"
                class="w-72 bg-slate-950 text-slate-300 p-3 font-mono text-xs overflow-y-auto border-l border-slate-700">
                <span class="text-slate-500">// Methoden-Status erscheint hier</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
